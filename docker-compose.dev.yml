services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pm-backend-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      UPLOADS_DIR: /app/uploads
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    networks:
      - appnet

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: pm-frontend-dev
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://api:3000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  uploads_data:
    driver: local
