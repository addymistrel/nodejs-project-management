services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pm-backend:latest
    container_name: pm-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    networks:
      - appnet
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: pm-frontend:latest
    container_name: pm-frontend
    restart: unless-stopped
    ports:
      - '${CLIENT_PORT:-80}:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - appnet
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  appnet:
    driver: bridge

volumes:
  uploads_data:
    driver: local
